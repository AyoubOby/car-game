name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - run: if [ -f icon.png ]; then mkdir -p assets && cp icon.png assets/icon.png && npm install --no-save @capacitor/assets && npx capacitor-assets generate --android; fi
      - run: cp native/*.java android/app/src/main/java/com/ayoub/roadrush/
      - run: sed -i 's#</manifest>#<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" /><uses-permission android:name="android.permission.READ_MEDIA_AUDIO" /></manifest>#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: road-rush-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
