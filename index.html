  unl='';if(dist/10>best){const ob=best;best=Math.floor(dist/10);for(const cr of CARS)if(cr.u>ob&&cr.u<=best)unl=cr.n;for(const mm of MAPS)if(mm.u>ob&&mm.u<=best)unl=(unl?unl+' + ':'')+'map '+mm.n;try{localStorage.setItem('rr_best',best)}catch(e){}}
}
function title(){
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b1020');g.addColorStop(1,'#1d2b4a');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='rgba(255,255,255,.12)';
  for(let y=-60+off;y<H;y+=60)x.fillRect(W/2-3,y,6,32);
  x.fillStyle='rgba(255,255,255,.35)';x.fillRect(40,0,4,H);x.fillRect(W-44,0,4,H);
  x.textAlign='center';
  x.fillStyle='#e8402b';x.font='italic 900 54px system-ui';x.fillText('ROAD',W/2,150);
  x.fillStyle='#fff';x.fillText('RUSH',W/2,205);
  pcar(W/2,330+Math.sin(tt*.08)*6,sel);
  const p=1+Math.sin(tt*.12)*.05;
  x.save();x.translate(W/2,450);x.scale(p,p);
  x.fillStyle='#e8402b';x.beginPath();x.roundRect(-90,-28,180,56,28);x.fill();
  x.fillStyle='#fff';x.font='bold 26px system-ui';x.fillText('PLAY',0,9);x.restore();
  x.fillStyle='#9fb0d0';x.font='16px system-ui';
  x.fillText('Best '+best,W/2,70);
  x.font='13px system-ui';x.fillText(CARS[sel].n+' \u00b7 '+MAPS[mp].n+' \u00b7 '+(mode?'Chase':'Classic'),W/2,508);x.font='16px system-ui';
  [].forEach(([t,bx])=>{x.fillStyle=t==='POLICE'?'rgba(255,60,60,.3)':'rgba(255,255,255,.14)';x.beginPath();x.roundRect(bx,486,104,36,18);x.fill();x.fillStyle='#fff';x.font='bold 15px system-ui';x.fillText(t,bx+52,509);});
  
  x.font='12px system-ui';x.fillStyle='#6f7f9f';x.fillText('version 10',W/2,592);x.fillStyle='#9fb0d0';x.font='16px system-ui';
  x.fillStyle='rgba(255,255,255,.14)';x.beginPath();x.roundRect(W/2-80,538,160,36,18);x.fill();x.fillStyle='#fff';x.font='bold 15px system-ui';x.fillText('SETTINGS',W/2,561);x.fillStyle='#9fb0d0';x.font='16px system-ui';muteBtn();
}
function update(k){
  let mv=(keys.l||pad.l?-1:0)+(keys.r||pad.r?1:0)||dir;if(ctl===0&&tx!==null&&!keys.l&&!keys.r){const d=tx-px;mv=Math.abs(d)<3?0:Math.sign(d)*Math.min(1.6,Math.abs(d)/14);}
  let mvy=(keys.u||pad.u?-1:0)+(keys.d||pad.d?1:0)||diry;if(ctl===0&&ty!==null&&!keys.u&&!keys.d){const d=ty-PY;mvy=Math.abs(d)<3?0:Math.sign(d)*Math.min(1.6,Math.abs(d)/14);}PY=Math.max(90,Math.min(H-50,PY+mvy*5*k));
  px=Math.max(RX+22,Math.min(RX+RW-22,px+mv*CARS[sel].h*k));tilt+=(mv*.1-tilt)*Math.min(1,.2*k);
  if(mv!==pmv&&mv!==0&&sp>5&&tt-lastSc>25){sfx.screech();lastSc=tt;}pmv=mv;
  sp=Math.min(12,4+dist/1800);
  dist+=sp*k;off=(off+sp*k)%60;spawn-=sp*k;
  if(spawn<=0){
    spawn=Math.max(110,230-sp*10);
    const ln=Math.floor(Math.random()*4);cars.push({l:ln,y:-60,f:[.35,.5,.65,.75][ln],c:cols[Math.floor(Math.random()*cols.length)]});
  }
  for(const o of cars){
    const y0=o.y;o.y+=sp*o.f*k+sp*.35*k;
    const ox=RX+o.l*75+37.5;
    if(Math.abs(ox-px)<38&&Math.abs(o.y-PY)<58)end();
    if(!o.p&&o.y>PY+40){o.p=1;if(Math.abs(ox-px)<75){sfx.whoosh();if(Math.abs(ox-px)<50&&Math.random()<.5)sfx.horn();}}
    else if(!o.p&&y0<PY&&o.y>=PY&&Math.abs(ox-px)<110){o.p=1;sfx.pass(Math.max(-1,Math.min(1,(ox-px)/150)));if(Math.abs(ox-px)<62&&Math.random()<.6)sfx.horn();}
  }
  cars=cars.filter(o=>o.y<H+80);
  if(mode===1){
    pt-=k;
    if(pt<=0&&pol.length<4){pol.push({x:Math.max(RX+22,Math.min(RX+RW-22,px+Math.random()*160-80)),y:H+110,v:1+Math.min(1.2,dist/9000)});pt=Math.max(260,520-dist/25);}
    for(const q of pol){
      q.y-=(q.v+sp*.12)*k;
      const dx=px-q.x;q.x+=Math.sign(dx)*Math.min(Math.abs(dx),2.4*k);
      if(Math.abs(q.x-px)<34&&Math.abs(q.y-PY)<60){end(1);break;}
      if(q.y<PY-100){q.dead=1;dist+=400;continue;}
      for(const o of cars){const ox=RX+o.l*75+37.5;if(Math.abs(ox-q.x)<36&&Math.abs(o.y-q.y)<60){q.dead=1;dist+=300;shake=8;for(let i=0;i<24;i++){const a=Math.random()*6.283,s=2+Math.random()*5;fx.push({x:q.x,y:q.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:2+Math.random()*4,life:1,c:['#ff2a2a','#2a6bff','#fff','#ffb703'][i%4]});}break;}}
    }
    pol=pol.filter(q=>!q.dead);
  }
}
function draw(){
  x.save();if(shake>.5)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  x.fillStyle=MAPS[mp].g;x.fillRect(0,0,W,H);
  scenery();for(let i=0;i<0;i++){const y=((i*110+dist)%660)-60;for(const [s,tx] of [[0,14],[1,W-14]]){const r=9+((i*7+s*3)%5);x.fillStyle='rgba(0,0,0,.3)';x.beginPath();x.arc(tx+3,y+3,r,0,6.283);x.fill();x.fillStyle=(i+s)%2?'#1f5a2c':'#276b35';x.beginPath();x.arc(tx,y,r,0,6.283);x.fill();x.fillStyle='rgba(255,255,255,.1)';x.beginPath();x.arc(tx-3,y-3,r*.5,0,6.283);x.fill();}}
  x.fillStyle=MAPS[mp].r;x.fillRect(RX,0,RW,H);
  for(let y=-60+off;y<H;y+=60)x.drawImage(tex,RX,y);
  x.fillStyle=MAPS[mp].e;x.fillRect(RX-4,0,4,H);x.fillRect(RX+RW,0,4,H);
  for(let l=1;l<4;l++)for(let y=-60+off;y<H;y+=60)x.fillRect(RX+l*75-2,y,4,32);
  if(sp>7&&st==='play'){x.fillStyle='rgba(255,255,255,.08)';for(let i=0;i<6;i++)x.fillRect(RX+Math.random()*RW,Math.random()*H,1.5,40+sp*4);}
  for(const o of cars)car(RX+o.l*75+37.5,o.y,o.c);
  for(const q of pol)polcar(q.x,q.y);
  if(mode===1&&st==='play')for(const q of pol)if(q.y>H-10){x.fillStyle=Math.floor(tt/7)%2?'#ff2a2a':'#2a6bff';x.beginPath();x.moveTo(q.x,H-6);x.lineTo(q.x-10,H-24);x.lineTo(q.x+10,H-24);x.fill();}
  if(st==='crash'||st==='over'){x.save();x.translate(px,PY);x.rotate(.5);car(0,0,'#2b2b2b');x.restore();}else{x.save();x.translate(px,PY);x.rotate(tilt);pcar(0,0,sel);x.restore();}
  for(const p of fx){x.globalAlpha=Math.max(0,p.life);x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill();}
  x.globalAlpha=1;
  x.restore();
  overlay();if(flash>0){x.fillStyle='rgba(255,255,255,'+flash*.8+')';x.fillRect(0,0,W,H);}
  x.fillStyle=vg;x.fillRect(0,0,W,H);
  x.fillStyle='#fff';x.font='bold 22px system-ui';x.textAlign='left';
  x.fillText('Score '+Math.floor(dist/10),12,30);x.textAlign='right';x.fillText('Best '+best,W-12,30);
  if(st==='play'){x.fillStyle='rgba(0,0,0,.45)';x.beginPath();x.arc(W/2,24,17,0,6.283);x.fill();x.fillStyle='#fff';x.fillRect(W/2-6,16,4,16);x.fillRect(W/2+2,16,4,16);}
  if(st==='play')muteBtn();if(st==='play'&&ctl===1)padBtns();
  if(mode===1&&st==='play'){x.textAlign='left';x.fillStyle='#ff4d4d';x.font='bold 13px system-ui';x.fillText('CHASE MODE \u00b7 '+pol.length+' on you',12,50);}
  if(st==='play'&&go>0){x.textAlign='center';x.fillStyle='#fff';x.font='bold 70px system-ui';x.fillText('GO!',W/2,300);}
  if(st!=='play'){
    if(st==='crash')return;if(st==='pause'){pauseMenu();return;}if(st==='audio'){audioMenu();return;}if(st==='count'){countdown();return;}if(st==='garage'){garage();return;}if(st==='maps'){mapsScr();return;}if(st==='setup'){setup();return;}if(st==='modes'){modesScr();return;}if(st==='start'){title();return;}x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,0,W,H);
    x.fillStyle='#fff';x.textAlign='center';
    x.font='bold 40px system-ui';x.fillText(st==='start'?'ROAD RUSH':(bust?'BUSTED!':'CRASH!'),W/2,230);
    x.font='20px system-ui';
    if(st==='over')x.fillText('Score '+Math.floor(dist/10)+' · Best '+best,W/2,275);
    else x.fillText('Dodge the traffic',W/2,275);
    if(st==='over'&&unl){x.fillStyle='#ffd24a';x.font='bold 16px system-ui';x.fillText('NEW UNLOCK: '+unl+'!',W/2,305);x.fillStyle='#fff';}
    OB.forEach(([n,y],i)=>{x.fillStyle=i===0?'#e8402b':'rgba(255,255,255,.14)';x.beginPath();x.roundRect(W/2-100,y-26,200,52,26);x.fill();x.fillStyle='#fff';x.font='bold 20px system-ui';x.fillText(n,W/2,y+7);});
    
  }
}
function loop(t){
  document.querySelector('.contact-btn').classList.toggle('is-home',st==='start');
  const k=Math.min((t-last)/16.67||1,3);last=t;
  tt+=k;go-=k;sfx.eng();sfx.mus();sfx.sir(st==='play'&&mode===1&&pol.length>0);
  if(st==='play')update(k);
  else if(st==='start')off=(off+3*k)%60;
  else if(st==='count'){cnt-=k/60;const n=Math.ceil(cnt);if(n!==lastN&&n>0){lastN=n;sfx.beep(440);}if(cnt<=0){st='play';go=40;sfx.beep(880);}}
  else if(st==='crash'){crashT+=k;off=(off+Math.max(0,3-crashT*.05)*k)%60;if(crashT>75)st='over';}
  for(const p of fx){p.x+=p.vx*k;p.y+=p.vy*k;p.vy+=.15*k;p.vx*=.98;p.life-=.016*k;}
  fx=fx.filter(p=>p.life>0);
  shake*=Math.pow(.9,k);flash=Math.max(0,flash-.05*k);
  draw();requestAnimationFrame(loop);
}
c.addEventListener('pointerdown',e=>{
  sfx.init();const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*W/r.width,my=(e.clientY-r.top)*H/r.height;
  if(st==='crash')return;
  if(st==='pause'){pauseClick(mx,my);return;}
  if(st==='over'){overClick(mx,my);return;}
  if(st==='count')return;
  if(st==='garage'){garageClick(mx,my);return;}
  if(st==='maps'){mapClick(mx,my);return;}
  if(st==='setup'){setupClick(mx,my);return;}
  if(st==='modes'){modeClick(mx,my);return;}
  if(st==='start'&&my>536&&my<576&&Math.abs(mx-W/2)<80){openAudio();return;}
  if(false){
    if(mx>18&&mx<122){gSel=sel;st='garage';sfx.tap();return;}
    if(mx>128&&mx<232){mSel=mp;st='maps';sfx.tap();return;}
    if(mx>238&&mx<342){mode=1-mode;try{localStorage.setItem('rr_mode',mode)}catch(e){}sfx.tap();return;}
  }
  if(st==='audio'){audioDown(mx,my);return;}
  if((st==='play'||st==='start')&&Math.hypot(mx-(W-28),my-64)<24){openAudio();return;}
  if(st==='play'&&Math.hypot(mx-W/2,my-24)<26){pause();return;}
  if(st==='start'){st='setup';sfx.tap();return;}
  if(st!=='play'){start();return;}
  if(ctl===1){const b=padHit(mx,my);if(b){ptr[e.pointerId]=b;pad[b]=1;}return;}
  dir=0;org={x:e.clientX,y:e.clientY,px0:px,py0:PY};tx=px;ty=PY;drag=false;
});
addEventListener('pointerup',e=>{if(ptr[e.pointerId]){pad[ptr[e.pointerId]]=0;delete ptr[e.pointerId];}tx=ty=null;dir=0;diry=0;org=null;drag=false;if(sl!==null){saveVol();if(sl===0)sfx.tap();sl=null;}});
addEventListener('pointermove',e=>{if(st!=='audio'||sl===null)return;const r=c.getBoundingClientRect();setSl((e.clientX-r.left)*W/r.width);});
addEventListener('pointermove',e=>{
  if(!org||st!=='play')return;if(ctl===0){const r=c.getBoundingClientRect(),sc=W/r.width*1.5;tx=Math.max(RX+22,Math.min(RX+RW-22,org.px0+(e.clientX-org.x)*sc));ty=Math.max(90,Math.min(H-50,org.py0+(e.clientY-org.y)*sc));return;}
  const dx=e.clientX-org.x,dy=e.clientY-org.y;
  if(!drag&&Math.hypot(dx,dy)>14)drag=true;
  if(drag){dir=Math.abs(dx)>14?Math.sign(dx):org.hd;diry=Math.abs(dy)>14?Math.sign(dy):0;}
});
addEventListener('pointercancel',e=>{if(ptr[e.pointerId]){pad[ptr[e.pointerId]]=0;delete ptr[e.pointerId];}tx=ty=null;dir=0;diry=0;org=null;drag=false;});
addEventListener('keydown',e=>{
  sfx.init();if(e.key==='p'||e.key==='Escape'){if(st==='play')pause();else if(st==='pause'){cnt=3;lastN=0;st='count';}}
  if(e.key==='ArrowUp'||e.key==='w')keys.u=1;
  if(e.key==='ArrowDown'||e.key==='s')keys.d=1;
  if(e.key==='ArrowLeft'||e.key==='a')keys.l=1;
  if(e.key==='ArrowRight'||e.key==='d')keys.r=1;
  if((e.key===' '||e.key==='Enter')){if(st==='start')st='setup';else if(st==='setup'||st==='over')start();}
});
addEventListener('keyup',e=>{
  if(e.key==='ArrowUp'||e.key==='w')keys.u=0;
  if(e.key==='ArrowDown'||e.key==='s')keys.d=0;
  if(e.key==='ArrowLeft'||e.key==='a')keys.l=0;
  if(e.key==='ArrowRight'||e.key==='d')keys.r=0;
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
reset();requestAnimationFrame(loop);
</script></body></html>
