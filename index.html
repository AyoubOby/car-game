<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road Rush</title>
<style>
:root{--bg:#f2f2ee;--fg:#1a1a1a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

</style></head><body>
<div id="w"><canvas id="g" width="360" height="600"></canvas></div>
<script>
const c=document.getElementById('g'),x=c.getContext('2d');
const dpr=Math.min(window.devicePixelRatio||1,3);c.width=360*dpr;c.height=600*dpr;x.scale(dpr,dpr);
const W=360,H=600,RX=30,RW=300;let PY=480;
let st='start',px,cars,sp,dist,off,spawn,dir=0,best=0,last=0,keys={};
let fx=[],shake=0,flash=0,crashT=0,tt=0,tilt=0,diry=0,org=null,drag=false,pmv=0,lastSc=-99,cnt=0,lastN=0,go=0;
const tex=document.createElement('canvas');tex.width=300;tex.height=60;
{const t=tex.getContext('2d');for(let i=0;i<260;i++){t.fillStyle=Math.random()<.5?'rgba(255,255,255,.05)':'rgba(0,0,0,.12)';t.fillRect(Math.random()*300,Math.random()*60,1+Math.random()*2,1+Math.random()*2);}}
const vg=x.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.4)');
const PB=[['RESUME',270],['RESTART',340],['MENU',410]];
const OB=[['RETRY',340],['MENU',410]];
let AC=null,E=null,muted=false,NB=null,MG=null,SK=null,vS=.7,vM=.5,back='pause',sl=null;
const M={t:0,s:0};
try{const a=JSON.parse(localStorage.getItem('rr_vol'));if(a){vS=+a[0];vM=+a[1];}}catch(e){}
try{muted=localStorage.getItem('rr_mute')==='1'}catch(e){}
const sfx={
  init(){
    if(!AC){try{
      AC=new (window.AudioContext||window.webkitAudioContext)();
      const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
      o.type='sawtooth';o2.type='square';f.type='lowpass';f.frequency.value=500;g.gain.value=0;
      o.connect(f);o2.connect(f);f.connect(g);g.connect(AC.destination);o.start();o2.start();
      E={o,o2,g,f};
      NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const nd=NB.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
      MG=AC.createGain();MG.gain.value=0;MG.connect(AC.destination);
      const sk=AC.createBufferSource(),bp=AC.createBiquadFilter();SK=AC.createGain();sk.buffer=NB;sk.loop=true;bp.type='bandpass';bp.frequency.value=1800;SK.gain.value=0;sk.connect(bp);bp.connect(SK);SK.connect(AC.destination);sk.start();
    }catch(e){AC=null;}}
    if(AC&&AC.state==='suspended')AC.resume();
  },
  eng(){
    if(!AC||!E)return;
    const t=AC.currentTime,on=st==='play'&&!muted,fr=(48+sp*11)*CARS[sel].p;
    E.g.gain.setTargetAtTime(on?.05*vS:0,t,.08);
    if(SK)SK.gain.setTargetAtTime(on&&sp>7&&(keys.l||keys.r||dir)?.04*vS:0,t,.05);
    E.o.frequency.setTargetAtTime(fr,t,.1);E.o2.frequency.setTargetAtTime(fr*.5,t,.1);
    E.f.frequency.setTargetAtTime(280+sp*60,t,.1);
  },
  crash(){
    if(!AC||muted)return;
    const t=AC.currentTime,n=AC.createBuffer(1,AC.sampleRate*.7,AC.sampleRate),d=n.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
    const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();
    s.buffer=n;g.gain.value=.5*vS;f.type='lowpass';f.frequency.setValueAtTime(3000,t);f.frequency.exponentialRampToValueAtTime(200,t+.6);
    s.connect(f);f.connect(g);g.connect(AC.destination);s.start();
    const o=AC.createOscillator(),og=AC.createGain();
    o.type='sine';o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(30,t+.4);
    og.gain.setValueAtTime(.7*vS,t);og.gain.exponentialRampToValueAtTime(.001,t+.5);
    o.connect(og);og.connect(AC.destination);o.start();o.stop(t+.5);
  },
  tap(){
    if(!AC||muted)return;
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type='triangle';o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(880,t+.08);
    g.gain.setValueAtTime(.15*vS,t);g.gain.exponentialRampToValueAtTime(.001,t+.12);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(t+.13);
  },
  pass(p){
    if(!AC||muted)return;
    const t=AC.currentTime,n=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate),d=n.getChannelData(0);
    for(let i=0;i<d.length;i++){const u=i/d.length;d[i]=(Math.random()*2-1)*Math.sin(u*Math.PI);}
    const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
    s.buffer=n;f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(1800,t);f.frequency.exponentialRampToValueAtTime(350,t+.45);
    g.gain.value=.22;s.connect(f);f.connect(g);
    if(AC.createStereoPanner){const pn=AC.createStereoPanner();pn.pan.value=p;g.connect(pn);pn.connect(AC.destination);}else g.connect(AC.destination);
    s.start();
  },
  horn(){
    if(!AC||muted)return;
    const t=AC.currentTime,g=AC.createGain();
    g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.09,t+.02);g.gain.setValueAtTime(.09,t+.28);g.gain.exponentialRampToValueAtTime(.001,t+.36);
    g.connect(AC.destination);
    for(const fr of [410,520]){const o=AC.createOscillator();o.type='square';o.frequency.value=fr;o.connect(g);o.start(t);o.stop(t+.38);}
  },
  beep(f){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.12*vS+.0001,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.26);},
  screech(){
    if(!AC||muted)return;
    const n=AC.createBuffer(1,AC.sampleRate*.25,AC.sampleRate),d=n.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
    const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
    s.buffer=n;f.type='bandpass';f.frequency.value=2600;f.Q.value=6;g.gain.value=.07;
    s.connect(f);f.connect(g);g.connect(AC.destination);s.start();
  },
  mus(){
    if(!AC||!MG)return;
    const now=AC.currentTime;
    MG.gain.setTargetAtTime(.22*vM*(st==='pause'||st==='audio'?.5:1),now,.1);
    if(M.t<now)M.t=now+.05;
    while(M.t<now+.3){this.step(M.s,M.t);M.t+=60/128/4;M.s=(M.s+1)%64;}
  },
  step(s,t){
    const bar=Math.floor(s/16),q=s%16;
    const bass=[55,43.65,65.41,49][bar],ch=[[220,261.63,329.63],[174.61,220,261.63],[261.63,329.63,392],[196,246.94,293.66]][bar];
    if(q%4===0){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(MG);o.start(t);o.stop(t+.18);}
    if(q%2===0)tn('triangle',ch[[0,1,2,1,0,2,1,2][q/2]]*2,t,.2,.3);
    if(q===0||q===6||q===8||q===14)tn('square',bass*2,t,.2,.13);
    if(q%4===2){const h=AC.createBufferSource(),hp=AC.createBiquadFilter(),g=AC.createGain();h.buffer=NB;hp.type='highpass';hp.frequency.value=7000;g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.04);h.connect(hp);hp.connect(g);g.connect(MG);h.start(t,Math.random()*.5,.05);}
  },
  whoosh(){
    if(!AC||!NB)return;
    const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
    s.buffer=NB;f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(600,t);f.frequency.exponentialRampToValueAtTime(2200,t+.25);
    g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.18*vS,t+.08);g.gain.linearRampToValueAtTime(0,t+.3);
    s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t,Math.random()*.5,.32);
  },
  horn(){
    if(!AC)return;
    const t=AC.currentTime;
    for(const fr of [400,500]){const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=fr;g.gain.setValueAtTime(.05*vS,t);g.gain.setValueAtTime(.05*vS,t+.18);g.gain.linearRampToValueAtTime(0,t+.24);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.25);}
  }
};
function tn(ty,f,t,d,v){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.02);}
function saveVol(){try{localStorage.setItem('rr_vol',JSON.stringify([vS,vM]))}catch(e){}}
function openAudio(){sfx.tap();back=st==='play'?'pause':'start';dir=0;diry=0;org=null;drag=false;st='audio';}
function setSl(mx){const v=Math.max(0,Math.min(1,(mx-60)/240));if(sl===0)vS=v;else vM=v;}
function audioDown(mx,my){
  if(Math.abs(mx-W/2)<100&&Math.abs(my-480)<26){sfx.tap();st=back;saveVol();return;}
  if(Math.abs(my-290)<26)sl=0;else if(Math.abs(my-390)<26)sl=1;else return;
  setSl(mx);
}
function audioMenu(){
  if(back==='start')title();
  x.fillStyle='rgba(0,0,0,.75)';x.fillRect(0,0,W,H);
  x.textAlign='center';x.fillStyle='#fff';x.font='bold 34px system-ui';x.fillText('SOUND',W/2,190);
  [['Car sounds',vS,260,290],['Music',vM,360,390]].forEach(([n,v,ly,ty])=>{
    x.font='bold 18px system-ui';x.fillStyle='#fff';x.textAlign='left';x.fillText(n,60,ly);
    x.textAlign='right';x.fillText(Math.round(v*100)+'%',300,ly);
    x.fillStyle='rgba(255,255,255,.2)';x.beginPath();x.roundRect(60,ty-4,240,8,4);x.fill();
    x.fillStyle='#e8402b';x.beginPath();x.roundRect(60,ty-4,240*v,8,4);x.fill();
    x.fillStyle='#fff';x.beginPath();x.arc(60+240*v,ty,13,0,6.283);x.fill();
  });
  x.fillStyle='#e8402b';x.beginPath();x.roundRect(W/2-100,454,200,52,26);x.fill();
  x.fillStyle='#fff';x.textAlign='center';x.font='bold 20px system-ui';x.fillText('DONE',W/2,487);
}
function countdown(){
  const n=Math.ceil(cnt),p=cnt-Math.floor(cnt)||1;
  x.fillStyle='rgba(0,0,0,.35)';x.fillRect(0,0,W,H);
  x.textAlign='center';x.fillStyle='#fff';
  x.font='bold 24px system-ui';x.fillText('Get ready!',W/2,240);
  x.globalAlpha=.3+.7*p;x.font='bold '+Math.round(90+p*50)+'px system-ui';x.fillText(String(Math.max(1,n)),W/2,370);
  x.globalAlpha=1;
}
function muteBtn(){
  const cx=W-28,cy=64;
  x.fillStyle='rgba(0,0,0,.45)';x.beginPath();x.arc(cx,cy,17,0,6.283);x.fill();
  x.fillStyle='#fff';x.beginPath();x.moveTo(cx-8,cy-3);x.lineTo(cx-3,cy-3);x.lineTo(cx+2,cy-8);x.lineTo(cx+2,cy+8);x.lineTo(cx-3,cy+3);x.lineTo(cx-8,cy+3);x.closePath();x.fill();
  x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();
  if(vS+vM===0){x.moveTo(cx+6,cy-5);x.lineTo(cx+13,cy+5);x.moveTo(cx+13,cy-5);x.lineTo(cx+6,cy+5);}else{x.arc(cx+3,cy,7,-.9,.9);}
  x.stroke();
}
function overClick(mx,my){OB.forEach(([n,y],i)=>{if(Math.abs(mx-W/2)<100&&Math.abs(my-y)<26){if(i===0)start();else{reset();st='start';}}});}
function pause(){if(st==='play'){sfx.tap();st='pause';dir=0;}}
function pauseClick(mx,my){sfx.tap();
  PB.forEach(([n,y],i)=>{if(Math.abs(mx-W/2)<100&&Math.abs(my-y)<26){if(i===0){cnt=3;lastN=0;st='count';}else if(i===1)start();else{reset();st='start';}}});
}
function pauseMenu(){
  x.fillStyle='rgba(0,0,0,.7)';x.fillRect(0,0,W,H);
  x.textAlign='center';x.fillStyle='#fff';x.font='bold 38px system-ui';x.fillText('PAUSED',W/2,200);
  x.font='16px system-ui';x.fillStyle='#9fb0d0';x.fillText('Score '+Math.floor(dist/10),W/2,232);
  for(const [n,y] of PB){x.fillStyle=n==='RESUME'?'#e8402b':'rgba(255,255,255,.14)';x.beginPath();x.roundRect(W/2-100,y-26,200,52,26);x.fill();x.fillStyle='#fff';x.font='bold 20px system-ui';x.fillText(n,W/2,y+7);}
}
try{best=+localStorage.getItem('rr_best')||0}catch(e){}
const CARS=[
  {n:'Roadster',c:'#e8402b',u:0,h:5.5,w:18,l:33,p:1},
  {n:'BMW M4',c:'#1c69d4',u:300,h:6.1,w:19,l:34,p:.95},
  {n:'Porsche 911',c:'#b8c0cc',u:800,h:6.7,w:20,l:33,p:1.1},
  {n:'Lamborghini',c:'#ff7a00',u:1500,h:7.4,w:21,l:35,p:1.35}
];
let sel=0,unl='',gSel=0;
try{sel=+localStorage.getItem('rr_car')||0}catch(e){}
if(!CARS[sel]||CARS[sel].u>best)sel=0;
const cols=['#3b82f6','#f5b82e','#22a06b','#9b59b6','#e8e8e8'];
function reset(){fx=[];shake=0;px=142.5;PY=480;diry=0;cars=[];sp=4;dist=0;off=0;spawn=0;}
function car(cx,cy,col){
  x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.roundRect(cx-20,cy-28,44,66,12);x.fill();
  x.fillStyle='#0d0d0d';for(const sx of[-1,1])for(const sy of[-1,1]){x.beginPath();x.roundRect(cx+sx*20-4,cy+sy*20-9,8,18,2);x.fill();}
  x.fillStyle=col;x.beginPath();x.roundRect(cx-18,cy-33,36,66,10);x.fill();
  const g=x.createLinearGradient(cx-18,0,cx+18,0);g.addColorStop(0,'rgba(0,0,0,.4)');g.addColorStop(.5,'rgba(255,255,255,.14)');g.addColorStop(1,'rgba(0,0,0,.4)');
  x.fillStyle=g;x.beginPath();x.roundRect(cx-18,cy-33,36,66,10);x.fill();
  x.fillStyle='#10192b';x.beginPath();x.roundRect(cx-13,cy-14,26,11,3);x.fill();x.beginPath();x.roundRect(cx-12,cy+10,24,8,3);x.fill();
  x.fillStyle='rgba(0,0,0,.28)';x.fillRect(cx-13,cy-3,26,13);
  x.fillStyle='rgba(255,255,255,.28)';x.fillRect(cx-11,cy-12,8,2);
  x.fillStyle='#fff6c8';x.fillRect(cx-15,cy-32,7,3);x.fillRect(cx+8,cy-32,7,3);
  x.fillStyle='#ff2a2a';x.fillRect(cx-15,cy+29,8,3);x.fillRect(cx+7,cy+29,8,3);
}
function carOld(cx,cy,col){
  x.fillStyle='rgba(0,0,0,.3)';x.fillRect(cx-17,cy-30,40,68);
  x.fillStyle='#111';x.fillRect(cx-22,cy-22,6,16);x.fillRect(cx+16,cy-22,6,16);x.fillRect(cx-22,cy+10,6,16);x.fillRect(cx+16,cy+10,6,16);
  x.fillStyle=col;x.beginPath();x.roundRect(cx-18,cy-32,36,64,9);x.fill();
  x.fillStyle='rgba(20,30,50,.85)';x.fillRect(cx-13,cy-16,26,12);x.fillRect(cx-13,cy+8,26,8);
}
function pcar(cx,cy,id){
  const C=CARS[id],w=C.w,l=C.l;
  x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.roundRect(cx-w-2,cy-l+5,w*2+8,l*2+4,12);x.fill();
  x.fillStyle='#0d0d0d';for(const sx of[-1,1])for(const sy of[-1,1]){x.beginPath();x.roundRect(cx+sx*(w+2)-4,cy+sy*20-9,8,18,2);x.fill();}
  x.fillStyle=C.c;x.beginPath();
  if(id===3){x.moveTo(cx-8,cy-l);x.lineTo(cx+8,cy-l);x.lineTo(cx+w,cy-8);x.lineTo(cx+w,cy+l-6);x.lineTo(cx+w-6,cy+l);x.lineTo(cx-w+6,cy+l);x.lineTo(cx-w,cy+l-6);x.lineTo(cx-w,cy-8);x.closePath();}
  else x.roundRect(cx-w,cy-l,w*2,l*2,id===2?17:10);
  x.fill();
  const g=x.createLinearGradient(cx-w,0,cx+w,0);g.addColorStop(0,'rgba(0,0,0,.4)');g.addColorStop(.5,'rgba(255,255,255,.16)');g.addColorStop(1,'rgba(0,0,0,.4)');
  x.fillStyle=g;x.fill();
  x.fillStyle='#10192b';
  if(id===2){x.beginPath();x.roundRect(cx-w+5,cy-15,w*2-10,36,11);x.fill();x.fillStyle='rgba(255,255,255,.18)';x.beginPath();x.roundRect(cx-w+9,cy-3,w*2-18,14,6);x.fill();}
  else if(id===3){x.beginPath();x.roundRect(cx-w+7,cy-17,w*2-14,13,3);x.fill();x.beginPath();x.roundRect(cx-w+8,cy+6,w*2-16,7,2);x.fill();x.fillStyle='rgba(0,0,0,.45)';for(let i=0;i<4;i++)x.fillRect(cx-w+6,cy+17+i*4,w*2-12,2);}
  else{x.beginPath();x.roundRect(cx-w+5,cy-14,w*2-10,11,3);x.fill();x.beginPath();x.roundRect(cx-w+6,cy+10,w*2-12,8,3);x.fill();x.fillStyle='rgba(0,0,0,.28)';x.fillRect(cx-w+5,cy-3,w*2-10,13);}
  if(id===1){x.fillStyle='#7ab8ff';x.fillRect(cx-5,cy-l,3,17);x.fillStyle='#1a2e8a';x.fillRect(cx-2,cy-l,3,17);x.fillStyle='#e0262f';x.fillRect(cx+1,cy-l,3,17);x.fillStyle='#0a0a0a';x.beginPath();x.roundRect(cx-9,cy-l+1,7,4,2);x.roundRect(cx+2,cy-l+1,7,4,2);x.fill();}
  x.fillStyle='#fff6c8';
  if(id===2){for(const sx of[-1,1]){x.beginPath();x.arc(cx+sx*12,cy-l+6,4,0,6.283);x.fill();}}
  else if(id===3){for(const sx of[-1,1]){x.beginPath();x.moveTo(cx+sx*9,cy-l+1);x.lineTo(cx+sx*(w-3),cy-l+9);x.lineTo(cx+sx*(w-3),cy-l+12);x.lineTo(cx+sx*8,cy-l+5);x.closePath();x.fill();}}
  else{x.fillRect(cx-w+1,cy-l+2,7,3);x.fillRect(cx+w-8,cy-l+2,7,3);}
  x.fillStyle='#ff2a2a';
  if(id===2)x.fillRect(cx-w+3,cy+l-5,w*2-6,3);else{x.fillRect(cx-w+2,cy+l-4,8,3);x.fillRect(cx+w-10,cy+l-4,8,3);}
}
function garage(){
  const C=CARS[gSel],ok=best>=C.u,n=CARS.length;
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b1020');g.addColorStop(1,'#1d2b4a');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.textAlign='center';x.fillStyle='#fff';x.font='bold 32px system-ui';x.fillText('GARAGE',W/2,60);
  x.fillStyle='#9fb0d0';x.font='15px system-ui';x.fillText('Best score '+best,W/2,86);
  x.fillStyle='#fff';x.font='bold 44px system-ui';x.fillText('\u2039',40,230);x.fillText('\u203A',W-40,230);
  x.save();x.translate(W/2,215);x.scale(2.1,2.1);if(!ok)x.globalAlpha=.3;pcar(0,0,gSel);x.restore();
  if(!ok){x.font='40px system-ui';x.fillText('\uD83D\uDD12',W/2,228);}
  x.fillStyle='#fff';x.font='bold 26px system-ui';x.fillText(C.n,W/2,345);
  x.fillStyle='#9fb0d0';x.font='15px system-ui';
  const s=Math.round((C.h-4.5)*1.7);
  x.fillText(ok?'Handling '+'\u2605'.repeat(s)+'\u2606'.repeat(5-s):'Unlock at score '+C.u,W/2,372);
  for(let i=0;i<n;i++){x.fillStyle=i===gSel?'#fff':'rgba(255,255,255,.3)';x.beginPath();x.arc(W/2+(i-(n-1)/2)*18,396,4,0,6.283);x.fill();}
  x.fillStyle=ok?(sel===gSel?'rgba(255,255,255,.14)':'#e8402b'):'rgba(255,255,255,.08)';x.beginPath();x.roundRect(W/2-100,404,200,52,26);x.fill();
  x.fillStyle=ok?'#fff':'#6f7f9f';x.font='bold 20px system-ui';x.fillText(!ok?'LOCKED':sel===gSel?'SELECTED':'SELECT',W/2,437);
  x.fillStyle='rgba(255,255,255,.14)';x.beginPath();x.roundRect(W/2-100,469,200,52,26);x.fill();
  x.fillStyle='#fff';x.fillText('BACK',W/2,502);
}
function garageClick(mx,my){
  const n=CARS.length;
  if(Math.abs(mx-40)<36&&Math.abs(my-215)<80){gSel=(gSel+n-1)%n;sfx.tap();return;}
  if(Math.abs(mx-(W-40))<36&&Math.abs(my-215)<80){gSel=(gSel+1)%n;sfx.tap();return;}
  if(Math.abs(mx-W/2)<100&&Math.abs(my-430)<26&&best>=CARS[gSel].u){sel=gSel;try{localStorage.setItem('rr_car',sel)}catch(e){}sfx.tap();return;}
  if(Math.abs(mx-W/2)<100&&Math.abs(my-495)<26){sfx.tap();st='start';}
}
function start(){sfx.tap();reset();st='count';cnt=3;lastN=0;}
function end(){
  st='crash';crashT=0;shake=20;flash=1;sfx.crash();
  for(let i=0;i<46;i++){const a=Math.random()*6.283,s=2+Math.random()*7;fx.push({x:px,y:PY,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:2+Math.random()*5,life:1,c:['#ffb703','#fb5607','#ff006e','#555','#eee'][i%5]});}
  unl='';if(dist/10>best){const ob=best;best=Math.floor(dist/10);for(const cr of CARS)if(cr.u>ob&&cr.u<=best)unl=cr.n;try{localStorage.setItem('rr_best',best)}catch(e){}}
}
function title(){
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b1020');g.addColorStop(1,'#1d2b4a');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='rgba(255,255,255,.12)';
  for(let y=-60+off;y<H;y+=60)x.fillRect(W/2-3,y,6,32);
  x.fillStyle='rgba(255,255,255,.35)';x.fillRect(40,0,4,H);x.fillRect(W-44,0,4,H);
  x.textAlign='center';
  x.fillStyle='#e8402b';x.font='italic 900 54px system-ui';x.fillText('ROAD',W/2,150);
  x.fillStyle='#fff';x.fillText('RUSH',W/2,205);
  pcar(W/2,330+Math.sin(tt*.08)*6,sel);
  const p=1+Math.sin(tt*.12)*.05;
  x.save();x.translate(W/2,450);x.scale(p,p);
  x.fillStyle='#e8402b';x.beginPath();x.roundRect(-90,-28,180,56,28);x.fill();
  x.fillStyle='#fff';x.font='bold 26px system-ui';x.fillText('PLAY',0,9);x.restore();
  x.fillStyle='#9fb0d0';x.font='16px system-ui';
  x.fillText('Best '+best,W/2,70);
  x.fillStyle='rgba(255,255,255,.14)';x.beginPath();x.roundRect(W/2-80,486,160,36,18);x.fill();
  x.fillStyle='#fff';x.font='bold 17px system-ui';x.fillText('GARAGE',W/2,510);
  x.font='12px system-ui';x.fillStyle='#6f7f9f';x.fillText('version 6',W/2,592);x.fillStyle='#9fb0d0';x.font='16px system-ui';
  x.fillText('Hold left or right to steer',W/2,540);x.fillText('Drag your finger up or down to move',W/2,565);muteBtn();
}
function update(k){
  const mv=(keys.l?-1:0)+(keys.r?1:0)||dir;
  const mvy=(keys.u?-1:0)+(keys.d?1:0)||diry;PY=Math.max(90,Math.min(H-50,PY+mvy*5*k));
  px=Math.max(RX+22,Math.min(RX+RW-22,px+mv*CARS[sel].h*k));tilt+=(mv*.1-tilt)*Math.min(1,.2*k);
  if(mv!==pmv&&mv!==0&&sp>5&&tt-lastSc>25){sfx.screech();lastSc=tt;}pmv=mv;
  sp=Math.min(12,4+dist/1800);
  dist+=sp*k;off=(off+sp*k)%60;spawn-=sp*k;
  if(spawn<=0){
    spawn=Math.max(110,230-sp*10);
    const ln=Math.floor(Math.random()*4);cars.push({l:ln,y:-60,f:[.35,.5,.65,.75][ln],c:cols[Math.floor(Math.random()*cols.length)]});
  }
  for(const o of cars){
    const y0=o.y;o.y+=sp*o.f*k+sp*.35*k;
    const ox=RX+o.l*75+37.5;
    if(Math.abs(ox-px)<38&&Math.abs(o.y-PY)<58)end();
    if(!o.p&&o.y>PY+40){o.p=1;if(Math.abs(ox-px)<75){sfx.whoosh();if(Math.abs(ox-px)<50&&Math.random()<.5)sfx.horn();}}
    else if(!o.p&&y0<PY&&o.y>=PY&&Math.abs(ox-px)<110){o.p=1;sfx.pass(Math.max(-1,Math.min(1,(ox-px)/150)));if(Math.abs(ox-px)<62&&Math.random()<.6)sfx.horn();}
  }
  cars=cars.filter(o=>o.y<H+80);
}
function draw(){
  x.save();if(shake>.5)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  x.fillStyle='#2f6b3a';x.fillRect(0,0,W,H);
  for(let i=0;i<6;i++){const y=((i*110+dist)%660)-60;for(const [s,tx] of [[0,14],[1,W-14]]){const r=9+((i*7+s*3)%5);x.fillStyle='rgba(0,0,0,.3)';x.beginPath();x.arc(tx+3,y+3,r,0,6.283);x.fill();x.fillStyle=(i+s)%2?'#1f5a2c':'#276b35';x.beginPath();x.arc(tx,y,r,0,6.283);x.fill();x.fillStyle='rgba(255,255,255,.1)';x.beginPath();x.arc(tx-3,y-3,r*.5,0,6.283);x.fill();}}
  x.fillStyle='#3a3d42';x.fillRect(RX,0,RW,H);
  for(let y=-60+off;y<H;y+=60)x.drawImage(tex,RX,y);
  x.fillStyle='#fff';x.fillRect(RX-4,0,4,H);x.fillRect(RX+RW,0,4,H);
  for(let l=1;l<4;l++)for(let y=-60+off;y<H;y+=60)x.fillRect(RX+l*75-2,y,4,32);
  if(sp>7&&st==='play'){x.fillStyle='rgba(255,255,255,.08)';for(let i=0;i<6;i++)x.fillRect(RX+Math.random()*RW,Math.random()*H,1.5,40+sp*4);}
  for(const o of cars)car(RX+o.l*75+37.5,o.y,o.c);
  if(st==='crash'||st==='over'){x.save();x.translate(px,PY);x.rotate(.5);car(0,0,'#2b2b2b');x.restore();}else{x.save();x.translate(px,PY);x.rotate(tilt);pcar(0,0,sel);x.restore();}
  for(const p of fx){x.globalAlpha=Math.max(0,p.life);x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill();}
  x.globalAlpha=1;
  x.restore();
  if(flash>0){x.fillStyle='rgba(255,255,255,'+flash*.8+')';x.fillRect(0,0,W,H);}
  x.fillStyle=vg;x.fillRect(0,0,W,H);
  x.fillStyle='#fff';x.font='bold 22px system-ui';x.textAlign='left';
  x.fillText('Score '+Math.floor(dist/10),12,30);x.textAlign='right';x.fillText('Best '+best,W-12,30);
  if(st==='play'){x.fillStyle='rgba(0,0,0,.45)';x.beginPath();x.arc(W/2,24,17,0,6.283);x.fill();x.fillStyle='#fff';x.fillRect(W/2-6,16,4,16);x.fillRect(W/2+2,16,4,16);}
  if(st==='play')muteBtn();
  if(st==='play'&&go>0){x.textAlign='center';x.fillStyle='#fff';x.font='bold 70px system-ui';x.fillText('GO!',W/2,300);}
  if(st!=='play'){
    if(st==='crash')return;if(st==='pause'){pauseMenu();return;}if(st==='audio'){audioMenu();return;}if(st==='count'){countdown();return;}if(st==='garage'){garage();return;}if(st==='start'){title();return;}x.fillStyle='rgba(0,0,0,.6)';x.fillRect(0,0,W,H);
    x.fillStyle='#fff';x.textAlign='center';
    x.font='bold 40px system-ui';x.fillText(st==='start'?'ROAD RUSH':'CRASH!',W/2,230);
    x.font='20px system-ui';
    if(st==='over')x.fillText('Score '+Math.floor(dist/10)+' · Best '+best,W/2,275);
    else x.fillText('Dodge the traffic',W/2,275);
    if(st==='over'&&unl){x.fillStyle='#ffd24a';x.font='bold 16px system-ui';x.fillText('NEW CAR UNLOCKED: '+unl+'!',W/2,305);x.fillStyle='#fff';}
    OB.forEach(([n,y],i)=>{x.fillStyle=i===0?'#e8402b':'rgba(255,255,255,.14)';x.beginPath();x.roundRect(W/2-100,y-26,200,52,26);x.fill();x.fillStyle='#fff';x.font='bold 20px system-ui';x.fillText(n,W/2,y+7);});
    
  }
}
function loop(t){
  const k=Math.min((t-last)/16.67||1,3);last=t;
  tt+=k;go-=k;sfx.eng();sfx.mus();
  if(st==='play')update(k);
  else if(st==='start')off=(off+3*k)%60;
  else if(st==='count'){cnt-=k/60;const n=Math.ceil(cnt);if(n!==lastN&&n>0){lastN=n;sfx.beep(440);}if(cnt<=0){st='play';go=40;sfx.beep(880);}}
  else if(st==='crash'){crashT+=k;off=(off+Math.max(0,3-crashT*.05)*k)%60;if(crashT>75)st='over';}
  for(const p of fx){p.x+=p.vx*k;p.y+=p.vy*k;p.vy+=.15*k;p.vx*=.98;p.life-=.016*k;}
  fx=fx.filter(p=>p.life>0);
  shake*=Math.pow(.9,k);flash=Math.max(0,flash-.05*k);
  draw();requestAnimationFrame(loop);
}
c.addEventListener('pointerdown',e=>{
  sfx.init();const r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*W/r.width,my=(e.clientY-r.top)*H/r.height;
  if(st==='crash')return;
  if(st==='pause'){pauseClick(mx,my);return;}
  if(st==='over'){overClick(mx,my);return;}
  if(st==='count')return;
  if(st==='garage'){garageClick(mx,my);return;}
  if(st==='start'&&Math.abs(mx-W/2)<80&&Math.abs(my-504)<20){gSel=sel;st='garage';sfx.tap();return;}
  if(st==='audio'){audioDown(mx,my);return;}
  if((st==='play'||st==='start')&&Math.hypot(mx-(W-28),my-64)<24){openAudio();return;}
  if(st==='play'&&Math.hypot(mx-W/2,my-24)<26){pause();return;}
  if(st!=='play'){start();return;}
  dir=(e.clientX-r.left)<r.width/2?-1:1;org={x:e.clientX,y:e.clientY,hd:dir};drag=false;
});
addEventListener('pointerup',()=>{dir=0;diry=0;org=null;drag=false;if(sl!==null){saveVol();if(sl===0)sfx.tap();sl=null;}});
addEventListener('pointermove',e=>{if(st!=='audio'||sl===null)return;const r=c.getBoundingClientRect();setSl((e.clientX-r.left)*W/r.width);});
addEventListener('pointermove',e=>{
  if(!org||st!=='play')return;
  const dx=e.clientX-org.x,dy=e.clientY-org.y;
  if(!drag&&Math.hypot(dx,dy)>14)drag=true;
  if(drag){dir=Math.abs(dx)>14?Math.sign(dx):org.hd;diry=Math.abs(dy)>14?Math.sign(dy):0;}
});
addEventListener('pointercancel',()=>{dir=0;diry=0;org=null;drag=false;});
addEventListener('keydown',e=>{
  sfx.init();if(e.key==='p'||e.key==='Escape'){if(st==='play')pause();else if(st==='pause'){cnt=3;lastN=0;st='count';}}
  if(e.key==='ArrowUp'||e.key==='w')keys.u=1;
  if(e.key==='ArrowDown'||e.key==='s')keys.d=1;
  if(e.key==='ArrowLeft'||e.key==='a')keys.l=1;
  if(e.key==='ArrowRight'||e.key==='d')keys.r=1;
  if((e.key===' '||e.key==='Enter')&&(st==='start'||st==='over'))start();
});
addEventListener('keyup',e=>{
  if(e.key==='ArrowUp'||e.key==='w')keys.u=0;
  if(e.key==='ArrowDown'||e.key==='s')keys.d=0;
  if(e.key==='ArrowLeft'||e.key==='a')keys.l=0;
  if(e.key==='ArrowRight'||e.key==='d')keys.r=0;
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
reset();requestAnimationFrame(loop);
</script></body></html>
